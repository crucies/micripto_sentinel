name: Investigacion Adversarial Cuantitativa Bisesion (10:30 y 22:00 BOT)

on:
  schedule:
    # 10:30 BOT = 14:30 UTC (Sesión Americana / Wall Street & ETFs)
    - cron: '30 14 * * *'
    # 22:00 BOT = 02:00 UTC (Sesión Asiática / Tokio & Hong Kong)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite disparo manual desde GitHub en cualquier momento

permissions:
  contents: write

jobs:
  run-adversarial-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Investigacion Adversarial Cuantitativa (Binance Spot)
        run: |
          python scripts/adversarial_researcher.py

      - name: Confirmar y Publicar Reporte Adversarial
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/adversarial_report.json rico_notas/micripto_sentinel_investigacion_adversarial.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(adversarial): actualizacion bisesion de auditoria cuantitativa [skip ci]" && git push)
